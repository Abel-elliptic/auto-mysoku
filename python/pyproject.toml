[project]
name = "autohp"
version = "0.1.0"
description = "マイソク自動生成システム - 社内PC側ジョブ処理・画像合成プログラム"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "smbprotocol>=1.13",
    "Pillow>=10.2",
    "PyYAML>=6.0",
    # WindowsにはIANAタイムゾーンDBが同梱されていないため、
    # zoneinfo.ZoneInfo("Asia/Tokyo")を使うには明示的に必要
    # （Linux/macOSはOS側にDBがあるため本来は不要だが、環境を問わず動くよう常に入れる）。
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
autohp-poller = "autohp.job_poller:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autohp*"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
