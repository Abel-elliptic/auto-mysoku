# 自社保証会社マイソク（in_house_guarantee）テンプレート設定
#
# 一般マイソク（general）と同じSlidesファイル・同じ画像配置を使う。
# 違いは保証会社・火災保険・備考の一部の文言のみで、これはすべて既存GAS
# （コード.js の updateSlideWithData()）がSlides側にreplaceAllTextで
# 焼き込んでからエクスポートするため、この設定ファイル（画像配置）は
# general.yaml と同一内容になる。
#
# 座標系はすべてA3基準キャンバス（page_size @ dpi から算出されるpx）。
#
# 写真配置座標（image_slots）は in_house.yaml/general.yaml と共通
# （2026-09-09確定、ユーザー確認済み）。

template_type: in_house_guarantee
display_name: "自社保証会社マイソク"
slides_template_file_id: "1rr3v0UMjSqMDJPjAvBveoqnj7r210nllVgyTxO22jOc"

page_size:
  width_mm: 420
  height_mm: 297
dpi: 300

required_images: ["間取り", "外観", "キッチン", "浴室", "画像1", "画像2"]
optional_images: []

image_slots:
  - key: background
    source: slides_export
    x_px: 0
    y_px: 0
    width_px: 4961
    height_px: 3508
    fit: stretch

  - key: 間取り
    source: nas
    source_filename: 間取り
